name: site
# Builds and checks the wattop.app site in site/. Deployment is not done here:
# Cloudflare Workers Builds deploys the site on merge to main.
on:
  push:
    branches: [main]
    paths: ['site/**']
  pull_request:
    paths: ['site/**']
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Unit tests, including the demo-data schema check against
      # internal/domain's JSON tags.
      - run: pnpm test
      - name: Install Chromium for the accessibility check
        run: pnpm exec playwright install --with-deps chromium
      # axe-core at 390 and 1440 px, dark and light, against `astro preview`.
      - name: Accessibility (axe)
        run: pnpm test:a11y

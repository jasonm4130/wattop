name: Feature request
description: Describe a workflow wattop could support better.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current dashboard falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or examples if useful.

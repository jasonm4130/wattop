version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # This root-module tag does not contain the exp/golden submodule.
    # Keep valid pseudoversion updates eligible.
    ignore:
      - dependency-name: github.com/charmbracelet/x/exp/golden
        versions: ["0.1.0"]
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

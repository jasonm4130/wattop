version: 2

project_name: wattop

# No cross-compilation: wattop links -lIOReport via CGO and only builds on
# an Apple Silicon host (see docs/limitations.md). One build target only.
builds:
  - id: wattop
    main: ./cmd/wattop
    binary: wattop
    env:
      - CGO_ENABLED=1
      - MACOSX_DEPLOYMENT_TARGET=14.0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -X github.com/jasonm4130/wattop/internal/version.Version={{.Version}}
      - -X github.com/jasonm4130/wattop/internal/version.Commit={{.Commit}}
      - -X github.com/jasonm4130/wattop/internal/version.BuildDate={{.Date}}

archives:
  - id: wattop
    formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
      - README.md
      - src: internal/soc/mactop/LICENSE
        dst: licenses/mactop-LICENSE
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"


release:
  github:
    owner: jasonm4130
    name: wattop
  prerelease: auto

version: 2

project_name: wattop

# No cross-compilation: wattop links -lIOReport via CGO and only builds on
# an Apple Silicon host (see docs/limitations.md). One build target only.
builds:
  - id: wattop
    main: ./cmd/wattop
    binary: wattop
    env:
      - CGO_ENABLED=1
      - MACOSX_DEPLOYMENT_TARGET=14.0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -X github.com/jasonm4130/wattop/internal/version.Version={{.Version}}
      - -X github.com/jasonm4130/wattop/internal/version.Commit={{.Commit}}
      - -X github.com/jasonm4130/wattop/internal/version.BuildDate={{.Date}}

archives:
  - id: wattop
    formats: [tar.gz]
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
      - README.md
      - src: internal/soc/mactop/LICENSE
        dst: licenses/mactop-LICENSE
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^Merge "
      - "^docs"
      - "^test"
      - "^chore"
      - "^style"
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Performance
      regexp: '^perf'
      order: 2
    - title: Other changes
      order: 999

release:
  github:
    owner: jasonm4130
    name: wattop
  prerelease: auto
  name_template: "wattop v{{ .Version }}"
  header: |
    Terminal monitor for Apple Silicon Macs: Claude Code and Codex sessions beside CPU/GPU/ANE power, temperatures and fans.

    **Requirements:** Apple Silicon (arm64), macOS 14 or newer.

    ```sh
    brew install --cask jasonm4130/wattop/wattop
    ```

    Archives include `checksums.txt` and GitHub build provenance
    ([verify a download](https://github.com/jasonm4130/wattop/blob/main/docs/releasing.md#verify-a-download)).
    They are not Apple-notarized.
